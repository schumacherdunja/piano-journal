<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Piano Stats</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0a0a0e;--card:#13131d;--card2:#191926;--border:#22222e;
  --gold:#c9a96e;--dim:#4a4860;--sub:#7a7898;--text:#e2ddf0;
  --red:#d96060;--green:#56b870;--blue:#5b9bd5;--purple:#a07cd0;--amber:#e8a838;
  --fs:1;
  --fsxs:calc(9px * var(--fs));--fssm:calc(11px * var(--fs));
  --fsmd:calc(13px * var(--fs));--fslg:calc(15px * var(--fs));--fsxl:calc(18px * var(--fs));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:Georgia,serif;min-height:100vh;}
#topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:100;max-width:640px;margin:0 auto;}
#topbar-title{font-size:var(--fslg);color:var(--gold);font-style:italic;flex:1}
#main{margin-top:52px;padding:14px;max-width:640px;margin-left:auto;margin-right:auto;padding-bottom:80px;}
#primary-nav{position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;max-width:640px;margin:0 auto;}
.pnav-btn{flex:1;background:transparent;border:none;color:var(--dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:Georgia,serif;padding:6px 0;}
.pnav-btn.active{color:var(--gold);}
.pnav-icon{font-size:20px;}.pnav-lbl{font-size:calc(9px * var(--fs));letter-spacing:.08em;text-transform:uppercase;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
.card-title{font-size:var(--fsxs);color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px;}
.section-hd{font-size:var(--fsxs);color:var(--dim);letter-spacing:.18em;text-transform:uppercase;margin:16px 0 8px;}
.empty{color:var(--dim);font-size:var(--fsmd);font-style:italic;padding:20px 0;text-align:center;}
.btn-sm{background:transparent;border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:5px 10px;font-size:var(--fsxs);cursor:pointer;font-family:Georgia,serif;}
input,select{background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:11px 12px;color:var(--text);font-size:16px;font-family:Georgia,serif;width:100%;outline:none;-webkit-appearance:none;display:block;}
textarea{background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:11px 12px;color:var(--text);font-size:14px;font-family:Georgia,serif;width:100%;outline:none;-webkit-appearance:none;resize:none;height:60px;}
.lbl{font-size:var(--fsxs);color:var(--dim);letter-spacing:.15em;text-transform:uppercase;display:block;margin-bottom:5px;}
.tag{display:inline-block;background:#1a1926;border:1px solid var(--border);border-radius:4px;font-size:var(--fsxs);padding:2px 6px;margin-right:4px;color:var(--sub);}
.tag.gold{border-color:var(--gold);color:var(--gold);}
.tag.blue{border-color:var(--blue);color:var(--blue);}
.prog-bg{background:#1a1926;border-radius:3px;height:4px;overflow:hidden;}
.prog-fill{height:4px;border-radius:3px;}
.piece-block{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.piece-header{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:10px;}
.piece-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border);}
.piece-body.open{display:block;}
.phase-chip{border-radius:4px;padding:2px 7px;font-size:var(--fsxs);}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:9px 18px;font-size:var(--fsmd);opacity:0;transition:all .25s;z-index:500;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:flex-end;justify-content:center;}
.modal-overlay.hidden{display:none;}
.modal{background:var(--card);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;}
.modal-title{font-size:var(--fslg);color:var(--gold);margin-bottom:14px;font-style:italic;}
.modal-close{float:right;background:transparent;border:none;color:var(--dim);font-size:calc(22px * var(--fs));cursor:pointer;}
.rating-btn{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:var(--fsxl);padding:8px 4px;cursor:pointer;font-family:Georgia,serif;text-align:center;}
.rating-btn.active{border-color:var(--gold);background:rgba(201,169,110,.12);}
</style>
</head>
<body>
<div id="topbar">
  <div id="topbar-title">&#x1F4C8; Piano Stats</div>
  <a href="piano-tracker-v2.html" style="background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--dim);font-size:var(--fsxs);padding:6px 10px;text-decoration:none;letter-spacing:.08em;text-transform:uppercase">&#x2190; Tracker</a>
</div>
<div id="main"></div>
<div id="primary-nav">
  <button class="pnav-btn active" id="pnav-history" onclick="navTo('history')">
    <span class="pnav-icon">&#x1F4CA;</span><span class="pnav-lbl">History</span>
  </button>
  <button class="pnav-btn" id="pnav-insights" onclick="navTo('insights')">
    <span class="pnav-icon">&#x1F4C8;</span><span class="pnav-lbl">Insights</span>
  </button>
  <button class="pnav-btn" id="pnav-bpm" onclick="navTo('bpm')">
    <span class="pnav-icon">&#x266A;</span><span class="pnav-lbl">BPM</span>
  </button>
  <button class="pnav-btn" id="pnav-perf" onclick="navTo('perf')">
    <span class="pnav-icon">&#x1F3AD;</span><span class="pnav-lbl">Performance</span>
  </button>
</div>
<div id="toast"></div>

<!-- Edit session modal -->
<div class="modal-overlay hidden" id="m-edit-hist">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('m-edit-hist')">&#x2715;</button>
    <div class="modal-title">Edit Session</div>
    <div style="font-size:var(--fsmd);color:var(--sub);margin-bottom:12px" id="eh-ctx"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
      <div><label class="lbl">Date</label><input id="eh-date" type="date"></div>
      <div><label class="lbl">Duration (min)</label><input id="eh-dur" type="number" min="1"></div>
    </div>
    <div style="margin-bottom:12px"><label class="lbl">Rating</label><div style="display:flex;gap:6px" id="eh-rrow"></div></div>
    <div style="margin-bottom:12px"><label class="lbl">Notes</label><textarea id="eh-notes"></textarea></div>
    <button onclick="saveHistEdit()" style="background:var(--gold);color:#0a0a0e;border:none;border-radius:8px;padding:13px;font-size:var(--fssm);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;font-family:Georgia,serif;font-weight:bold;width:100%">Save Changes</button>
    <button onclick="deleteHistSession()" style="margin-top:8px;width:100%;text-align:center;background:transparent;border:1px solid var(--red);color:var(--red);border-radius:8px;padding:10px;cursor:pointer;font-family:Georgia,serif;font-size:var(--fsxs)">Delete Session</button>
    <input type="hidden" id="eh-id">
  </div>
</div>

<script>
// ── DATA ─────────────────────────────────────────────────────────
var pieces=[],sessions=[],srList=[],perfPlans=[];
function reload(){
  pieces    = JSON.parse(localStorage.getItem('pj2-pieces')    || '[]');
  sessions  = JSON.parse(localStorage.getItem('pj2-sessions')  || '[]');
  srList    = JSON.parse(localStorage.getItem('pj2-sr')        || '[]');
  perfPlans = JSON.parse(localStorage.getItem('pj2-perf')      || '[]');
}
function persist(){
  localStorage.setItem('pj2-pieces',   JSON.stringify(pieces));
  localStorage.setItem('pj2-sessions', JSON.stringify(sessions));
  localStorage.setItem('pj2-sr',       JSON.stringify(srList));
  localStorage.setItem('pj2-perf',     JSON.stringify(perfPlans));
}
reload();

// ── HELPERS ───────────────────────────────────────────────────────
function today(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDur(m){
  if(!m) return '0m';
  if(m<60) return m+'m';
  return Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':'');
}
function addWks(d,w){ var dt=new Date(d); dt.setDate(dt.getDate()+w*7); return dt.toISOString().slice(0,10); }
function showToast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2200); }
function tog(id){ var el=document.getElementById(id); if(el) el.classList.toggle('open'); }
function openModal(id){ document.getElementById(id).classList.remove('hidden'); }
function closeModal(id){ document.getElementById(id).classList.add('hidden'); }
function nvSym(k){ return {quarter:'\u2669',eighth:'\u266a',half:'h',dotted_quarter:'\u2669.',dotted_eighth:'\u266a.',sixteenth:'\u266c'}[k]||'\u2669'; }
function sColor(k){ return {notes:'#7ec8e3',tempo:'#c9a96e',memory:'#a07cd0',interp:'#56b870',mock:'#d96060',peak:'#5b9bd5'}[k]||'var(--dim)'; }
function sName(k){ return {notes:'Note Learning',tempo:'Tempo Building',memory:'Memorisation',interp:'Interpretation',mock:'Mock Run-throughs',peak:'Recovery & Peak'}[k]||k; }
function minsFor(pid,sid,ssid){
  return sessions.reduce(function(tot,s){
    if(!s.entries) return tot+(s.pieceId===pid?s.duration:0);
    return tot+s.entries.reduce(function(a,e){
      if(e.pieceId!==pid) return a;
      if(sid&&e.sectionId!==sid) return a;
      if(ssid&&e.ssId!==ssid) return a;
      return a+(e.duration||0);
    },0);
  },0);
}
function lastBPMFor(pid,sid,ssid){
  var recent=sessions.filter(function(s){
    if(!s.entries) return false;
    return s.entries.some(function(e){
      return e.pieceId===pid&&(sid?e.sectionId===sid:true)&&(ssid?e.ssId===ssid:true)&&(e.bpmEnd||e.bpmStart);
    });
  }).sort(function(a,b){return b.date.localeCompare(a.date);});
  if(!recent.length) return null;
  var e=recent[0].entries.find(function(e){
    return e.pieceId===pid&&(sid?e.sectionId===sid:true)&&(ssid?e.ssId===ssid:true)&&(e.bpmEnd||e.bpmStart);
  });
  if(!e) return null;
  return {start:e.bpmStart||null,end:e.bpmEnd||e.bpmStart,noteVal:e.noteVal||null};
}
function sortedSecs(secs){
  return secs.slice().sort(function(a,b){
    var ma=String(a.name||'').match(/^(\d+)/), mb=String(b.name||'').match(/^(\d+)/);
    var na=ma?+ma[1]:Infinity, nb=mb?+mb[1]:Infinity;
    return na!==nb?na-nb:String(a.name).localeCompare(String(b.name));
  });
}
function sortedSS(ss){
  return ss.slice().sort(function(a,b){
    var ma=String(a.name||'').match(/^(\d+)/), mb=String(b.name||'').match(/^(\d+)/);
    var na=ma?+ma[1]:Infinity, nb=mb?+mb[1]:Infinity;
    return na!==nb?na-nb:String(a.name).localeCompare(String(b.name));
  });
}
function diffTag(d){
  if(!d) return '';
  var c=d==='hard'?'var(--red)':d==='medium'?'var(--amber)':'var(--green)';
  var l=d==='hard'?'Hard':d==='medium'?'Med':'Easy';
  return ' <span class="phase-chip" style="background:'+c+'22;border:1px solid '+c+';color:'+c+'">'+l+'</span>';
}

// ── NAV ───────────────────────────────────────────────────────────
var curView='history';
var chartInsts={};
function navTo(v){
  reload();
  curView=v;
  Object.keys(chartInsts).forEach(function(k){ if(chartInsts[k]){chartInsts[k].destroy();delete chartInsts[k];} });
  ['history','insights','bpm','perf'].forEach(function(p){
    var b=document.getElementById('pnav-'+p); if(b) b.classList.toggle('active',p===v);
  });
  render();
}
function render(){
  var el=document.getElementById('main'); if(!el) return;
  if(curView==='history')  { el.innerHTML=vHistory();  setTimeout(histChartInit,60); }
  else if(curView==='insights') { el.innerHTML=vInsights(); setTimeout(function(){drawInsightCharts();insSecPer('total');},60); }
  else if(curView==='bpm')      { el.innerHTML=vBPM();      setTimeout(drawBPMChart,60); }
  else if(curView==='perf')       el.innerHTML=vPerf();
}

// ── HISTORY ───────────────────────────────────────────────────────
var histChartInst=null, histChartPer='week';

function vHistory(){
  var pieceOpts='<option value="">All pieces</option>';
  pieces.forEach(function(p){ pieceOpts+='<option value="'+p.id+'">'+p.name+'</option>'; });
  var h='<div class="card" style="margin-bottom:12px">'
    +'<div class="card-title">Practice Time</div>'
    +'<div style="display:flex;gap:8px;margin-bottom:10px;align-items:center">'
    +'<select id="hch-piece" onchange="histOnPieceChange()" style="flex:1;font-size:16px">'+pieceOpts+'</select>'
    +'<select id="hch-sec" onchange="histChartUpdate()" style="flex:1;font-size:16px;display:none"><option value="">All sections</option></select>'
    +'</div>'
    +'<div style="display:flex;gap:6px;margin-bottom:10px">'
    +'<button id="hch-day"   class="btn-sm" onclick="histChartSetPer(\'day\')"   style="flex:1;text-align:center">Day</button>'
    +'<button id="hch-week"  class="btn-sm" onclick="histChartSetPer(\'week\')"  style="flex:1;text-align:center;background:var(--gold);color:#0a0a0e;border-color:var(--gold)">Week</button>'
    +'<button id="hch-month" class="btn-sm" onclick="histChartSetPer(\'month\')" style="flex:1;text-align:center">Month</button>'
    +'</div>'
    +'<div id="hch-section-compare" style="display:none;margin-bottom:10px"></div>'
    +'<canvas id="hch-canvas" style="max-height:240px"></canvas>'
    +'</div>'
    +'<div style="font-size:var(--fsxs);color:var(--dim);letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px">Sessions</div>';

  var EMOJIS=['\ud83d\ude1e','\ud83d\ude10','\ud83d\ude42','\ud83d\ude0a','\ud83c\udf1f'];
  var RTXT=['Rough','Okay','Good','Great','Brilliant'];
  sessions.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).forEach(function(s){
    var bpmTags='';
    if(s.entries) s.entries.forEach(function(e){
      if(e.bpmEnd||e.bpmStart){
        var bv=e.bpmStart&&e.bpmEnd&&e.bpmStart!==e.bpmEnd?e.bpmStart+'\u2192'+e.bpmEnd:(e.bpmEnd||e.bpmStart);
        bpmTags+='<span class="tag blue">'+nvSym(e.noteVal||'quarter')+' '+bv+(e.sectionName?' '+e.sectionName:'')+'</span>';
      }
    });
    h+='<div class="card" style="cursor:pointer;margin-bottom:8px" onclick="openHistEdit('+s.id+')">'
      +'<div style="flex:1">'
      +'<div style="font-size:var(--fslg)">'
      +(s.entries&&s.entries.length?[...new Set(s.entries.map(function(e){return e.pieceName;}))].join(', '):'Practice session')
      +'</div>'
      +(s.entries&&s.entries.length?'<div style="font-size:var(--fsxs);color:var(--blue);margin-top:2px">'+s.entries.map(function(e){return e.sectionName||'Whole piece';}).join(' \u00b7 ')+'</div>':'')
      +'<div style="margin-top:4px"><span class="tag">'+s.date+'</span><span class="tag">'+fmtDur(s.duration)+'</span>'
      +'<span class="tag gold">'+EMOJIS[(s.rating||3)-1]+' '+RTXT[(s.rating||3)-1]+'</span>'+bpmTags+'</div>'
      +(s.notes?'<div style="font-size:var(--fsmd);color:var(--dim);font-style:italic;margin-top:4px">"'+s.notes+'"</div>':'')
      +'</div></div>';
  });
  return h;
}

function histChartSetPer(per){
  histChartPer=per;
  ['day','week','month'].forEach(function(p){
    var b=document.getElementById('hch-'+p); if(!b) return;
    var act=p===per;
    b.style.background=act?'var(--gold)':'transparent';
    b.style.color=act?'#0a0a0e':'var(--dim)';
    b.style.borderColor=act?'var(--gold)':'var(--border)';
  });
  histChartUpdate();
}

function histOnPieceChange(){
  var pieceEl=document.getElementById('hch-piece');
  var secEl=document.getElementById('hch-sec');
  var pid=pieceEl&&pieceEl.value?+pieceEl.value:null;
  if(secEl){
    if(pid){
      var p=pieces.find(function(x){return x.id===pid;});
      var opts='<option value="">All sections</option>';
      if(p) sortedSecs(p.sections).forEach(function(sec){opts+='<option value="'+sec.id+'">'+sec.name+'</option>';});
      secEl.innerHTML=opts; secEl.style.display='block';
    } else { secEl.style.display='none'; secEl.value=''; }
  }
  histChartUpdate();
}

function histChartUpdate(){
  var pieceEl=document.getElementById('hch-piece');
  var secEl=document.getElementById('hch-sec');
  var pid=pieceEl&&pieceEl.value?+pieceEl.value:null;
  var sid=secEl&&secEl.value?+secEl.value:null;
  var compareEl=document.getElementById('hch-section-compare');

  // When whole piece selected (pid set, no sid): show section comparison
  if(pid&&!sid){
    var p=pieces.find(function(x){return x.id===pid;});
    if(p&&p.sections.length>1){
      compareEl.style.display='block';
      drawSectionCompare(p,compareEl);
    } else { compareEl.style.display='none'; }
  } else { if(compareEl) compareEl.style.display='none'; }

  var filtered=sessions.filter(function(s){
    if(pid&&(!s.entries||!s.entries.some(function(e){return e.pieceId===pid;}))) return false;
    if(sid&&(!s.entries||!s.entries.some(function(e){return e.sectionId===sid;}))) return false;
    return true;
  });

  function periodKey(d){
    if(histChartPer==='day') return d;
    if(histChartPer==='month') return d.slice(0,7);
    var dt=new Date(d); var day=dt.getDay()||7; dt.setDate(dt.getDate()-day+1);
    return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  }
  var buckets={};
  filtered.forEach(function(s){
    var k=periodKey(s.date); var mins=s.duration||0;
    if(sid&&s.entries) mins=s.entries.filter(function(e){return e.sectionId===sid;}).reduce(function(a,e){return a+(e.duration||0);},0);
    else if(pid&&s.entries) mins=s.entries.filter(function(e){return e.pieceId===pid;}).reduce(function(a,e){return a+(e.duration||0);},0);
    buckets[k]=(buckets[k]||0)+mins;
  });
  var labels=Object.keys(buckets).sort();
  var data=labels.map(function(k){return buckets[k];});
  var dispLabels=labels.map(function(k){return histChartPer==='month'?k:k.slice(5);});

  var canvas=document.getElementById('hch-canvas'); if(!canvas) return;
  if(histChartInst){histChartInst.destroy();histChartInst=null;}
  if(!labels.length){canvas.style.display='none';return;}
  canvas.style.display='block';
  histChartInst=new Chart(canvas,{
    type:'bar',
    data:{labels:dispLabels,datasets:[{label:'Minutes',data:data,
      backgroundColor:'rgba(201,169,110,0.5)',borderColor:'rgba(201,169,110,1)',borderWidth:1,borderRadius:3}]},
    options:{responsive:true,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return fmtDur(ctx.raw);}}}},
      scales:{
        x:{ticks:{color:'#7a7898',font:{size:10},maxRotation:45},grid:{color:'#22222e'}},
        y:{ticks:{color:'#7a7898',callback:function(v){return fmtDur(v);}},grid:{color:'#22222e'},beginAtZero:true}
      }
    }
  });
}

function drawSectionCompare(p,container){
  // Build datasets: one bar per section, grouped by period
  var cols=['#c9a96e','#5b9bd5','#56b870','#a07cd0','#d96060','#e8a838','#5bc8c8','#e87438'];
  var secs=sortedSecs(p.sections);
  // Collect all period keys across all sections
  var allKeys={};
  function periodKey(d){
    if(histChartPer==='day') return d;
    if(histChartPer==='month') return d.slice(0,7);
    var dt=new Date(d); var day=dt.getDay()||7; dt.setDate(dt.getDate()-day+1);
    return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  }
  var secBuckets=secs.map(function(sec){
    var b={};
    sessions.forEach(function(s){
      if(!s.entries) return;
      var mins=s.entries.filter(function(e){return e.sectionId===sec.id;}).reduce(function(a,e){return a+(e.duration||0);},0);
      if(!mins) return;
      var k=periodKey(s.date);
      b[k]=(b[k]||0)+mins;
      allKeys[k]=1;
    });
    return b;
  });
  var labels=Object.keys(allKeys).sort();
  if(!labels.length){ container.style.display='none'; return; }
  var dispLabels=labels.map(function(k){return histChartPer==='month'?k:k.slice(5);});

  container.innerHTML='<div style="font-size:var(--fsxs);color:var(--gold);letter-spacing:.1em;margin-bottom:6px">Section Comparison</div>'
    +'<canvas id="hch-sec-compare" style="max-height:220px"></canvas>';
  setTimeout(function(){
    var cv=document.getElementById('hch-sec-compare'); if(!cv) return;
    if(chartInsts['sec-compare']){chartInsts['sec-compare'].destroy();}
    chartInsts['sec-compare']=new Chart(cv,{
      type:'bar',
      data:{
        labels:dispLabels,
        datasets:secs.map(function(sec,i){
          return {
            label:sec.name,

function renderSecCal(sidStr,targetId){
  var sid=+sidStr; var el=document.getElementById(targetId); if(!el) return;
  if(!sid){el.innerHTML='';return;}
  var now=new Date(); var year=now.getFullYear(); var month=now.getMonth();
  var firstDay=new Date(year,month,1).getDay(); var daysInMonth=new Date(year,month+1,0).getDate();
  var t=today(); var secDates={};
  sessions.forEach(function(s){
    if(s.entries&&s.entries.some(function(e){return e.sectionId===sid;})) secDates[s.date]=(secDates[s.date]||0)+s.duration;
  });
  var h='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(d){h+='<div style="text-align:center;font-size:var(--fsxs);color:var(--dim)">'+d+'</div>';});
  h+='</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">';
  for(var i=0;i<firstDay;i++) h+='<div></div>';
  for(var d=1;d<=daysInMonth;d++){
    var ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var mins=secDates[ds]||0; var isT=ds===t;
    h+='<div style="background:'+(mins>0?'var(--gold)':'var(--card2)')+';border:1px solid '+(isT?'var(--gold)':'var(--border)')+';border-radius:4px;padding:4px 2px;text-align:center">'
      +'<div style="font-size:calc(9px * var(--fs));color:'+(mins>0?'#0a0a0e':'var(--dim)')+'">'+d+'</div>'
      +(mins?'<div style="font-size:calc(7px * var(--fs));color:#0a0a0e">'+fmtDur(mins)+'</div>':'')
      +'</div>';
  }
  el.innerHTML=h+'</div>';
}

function buildMonthCal(){
  var now=new Date(); var year=now.getFullYear(); var month=now.getMonth();
  var firstDay=new Date(year,month,1).getDay(); var daysInMonth=new Date(year,month+1,0).getDate();
  var t=today(); var dayData={};
  sessions.forEach(function(s){ dayData[s.date]=(dayData[s.date]||0)+s.duration; });
  var maxM=Math.max.apply(null,Object.values(dayData).concat([1]));
  var mNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var h='<div style="font-size:var(--fsmd);color:var(--gold);margin-bottom:8px">'+mNames[month]+' '+year+'</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(d){h+='<div style="text-align:center;font-size:var(--fsxs);color:var(--dim)">'+d+'</div>';});
  h+='</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">';
  for(var i=0;i<firstDay;i++) h+='<div></div>';
  for(var d=1;d<=daysInMonth;d++){
    var ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var mins=dayData[ds]||0; var intensity=mins>0?Math.max(0.2,mins/maxM):0; var isT=ds===t;
    h+='<div style="background:'+(mins>0?'rgba(201,169,110,'+intensity+')':'var(--card2)')+';border:1px solid '+(isT?'var(--gold)':'var(--border)')+';border-radius:4px;padding:4px 2px;text-align:center">'
      +'<div style="font-size:calc(9px * var(--fs));color:'+(mins>60?'#0a0a0e':mins>0?'var(--gold)':'var(--dim)')+'">'+d+'</div>'
      +(mins?'<div style="font-size:calc(7px * var(--fs));color:'+(mins>60?'#0a0a0e':'var(--gold)')+'">'+fmtDur(mins)+'</div>':'')
      +'</div>';
  }
  return h+'</div>';
}

function drawBPMChart(){
  var canvas=document.getElementById('bpm-canvas'); if(!canvas) return;
  if(chartInsts['bpm']){chartInsts['bpm'].destroy();delete chartInsts['bpm'];}
  var pieceEl=document.getElementById('bpm-piece');
  var filterPid=pieceEl&&pieceEl.value?+pieceEl.value:null;
  var cols=['#c9a96e','#5b9bd5','#56b870','#a07cd0','#d96060','#e8a838','#5bc8c8','#e87438'];
  var allDates=[]; var ds=[]; var ci=0;
  var plist=filterPid?pieces.filter(function(p){return p.id===filterPid;}):pieces;
  plist.forEach(function(p){
    sortedSecs(p.sections).forEach(function(sec){
      var nvMap={};
      sessions.forEach(function(s){
        if(!s.entries) return;
        var entry=s.entries.find(function(e){return e.sectionId===sec.id&&(e.bpmEnd||e.bpmStart);});
        if(!entry) return;
        var nv=entry.noteVal||'quarter';
        if(!nvMap[nv]) nvMap[nv]=[];
        nvMap[nv].push({date:s.date,y:entry.bpmEnd||entry.bpmStart});
        if(allDates.indexOf(s.date)<0) allDates.push(s.date);
      });
      Object.keys(nvMap).forEach(function(nv){
        var pts=nvMap[nv].sort(function(a,b){return a.date.localeCompare(b.date);});
        var col=cols[ci%cols.length]; ci++;
        var lbl=(filterPid?'':p.name+' \u203a ')+sec.name+' '+nvSym(nv);
        ds.push({label:lbl,data:pts.map(function(pt){return {x:pt.date,y:pt.y};}),
          borderColor:col,backgroundColor:col+'33',tension:.3,pointRadius:5,pointHoverRadius:7,fill:false});
        if(sec.pBpm&&sec.pNV===nv){
          ds.push({label:'Target: '+sec.name+' '+nvSym(nv),
            data:pts.map(function(pt){return {x:pt.date,y:sec.pBpm};}),
            borderColor:col,borderDash:[6,4],borderWidth:1.5,pointRadius:0,fill:false,backgroundColor:'transparent'});
        }
      });
    });
  });
  if(!ds.length){canvas.parentElement.innerHTML+='<div class="empty">Log sessions with BPM to see chart.</div>';return;}
  allDates.sort();
  chartInsts['bpm']=new Chart(canvas,{type:'line',data:{datasets:ds},options:{responsive:true,
    interaction:{mode:'index',intersect:false},
    scales:{
      x:{type:'category',labels:allDates,ticks:{color:'#7a7898',maxRotation:45,font:{size:10}},grid:{color:'#22222e'}},
      y:{ticks:{color:'#7a7898'},grid:{color:'#22222e'},title:{display:true,text:'BPM',color:'#4a4860'}}
    },
    plugins:{legend:{labels:{color:'#7a7898',font:{size:10}}}}}});
}

      +'<div class="piece-header" onclick="tog(\''+tid+'\')">'
      +'<div style="flex:1"><div style="font-size:var(--fslg)">'+pl.pieceName+(pl.composer?' <span style="font-size:var(--fsxs);color:var(--sub)">\u2014 '+pl.composer+'</span>':'')+'</div>'
      +'<div style="font-size:var(--fsmd);color:'+urg+';margin-top:3px">\ud83c\udfb9 '+pl.perfDate+' \u00b7 '+dls+'</div>'
      +'<div style="margin-top:6px"><div style="font-size:var(--fsxs);color:var(--dim);margin-bottom:3px">READINESS '+pct+'%</div>'
      +'<div class="prog-bg"><div class="prog-fill" style="width:'+pct+'%;background:'+urg+'"></div></div></div>'
      +(as?'<div style="margin-top:6px"><span class="phase-chip" style="background:'+as.color+'22;border:1px solid '+as.color+';color:'+as.color+'">'+as.icon+' '+as.name+' \u2014 active</span></div>':'')
      +'</div><span style="color:var(--dim);font-size:calc(20px * var(--fs))">&#x203a;</span></div>'
      +'<div class="piece-body" id="'+tid+'">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">'
      +'<label class="lbl" style="margin-bottom:0;flex:1">Edit date</label>'
      +'<input type="date" id="pfd-'+pl.id+'" value="'+pl.perfDate+'" style="width:auto;font-size:16px">'
      +'<button onclick="reschedulePerfPlan('+pl.id+',document.getElementById(\'pfd-'+pl.id+'\').value)" style="background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:6px 10px;font-size:var(--fsxs);cursor:pointer;font-family:Georgia,serif">Reschedule</button>'
      +'</div>'
      +'<div style="font-size:var(--fsxs);color:var(--dim);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px">Stages</div>';
    pl.stages.forEach(function(s){
      var st=stageStatus(s,t); var isA=st.label==='Active now';
      h+='<div style="background:'+(isA?s.color+'11':'#0a0a12')+';border:1px solid '+(isA?s.color:'#1c1c28')+';border-radius:8px;padding:11px;margin-bottom:7px">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
        +'<div style="flex:1"><div style="display:flex;align-items:center;gap:7px">'
        +'<span style="font-size:var(--fsxl)">'+s.icon+'</span>'
        +'<div><div style="font-size:var(--fsmd);color:'+(s.done?'var(--dim)':st.color)+';text-decoration:'+(s.done?'line-through':'none')+'">'+s.name+'</div>'
        +'<div style="font-size:var(--fsxs);color:var(--dim)">'+s.sd+' \u2192 '+s.ed+' \u00b7 <span style="color:'+st.color+'">'+st.label+'</span></div></div></div>'
        +'<div style="font-size:calc(10px * var(--fs));color:var(--dim);margin-top:5px;line-height:1.6">'+s.desc+'</div>'
        +'<textarea id="psn-'+pl.id+'-'+s.key+'" style="background:#0b0b12;border:1px solid var(--border);border-radius:5px;padding:7px;color:var(--text);font-size:14px;font-family:Georgia,serif;width:100%;height:48px;resize:none;outline:none;margin-top:7px" placeholder="Notes\u2026">'+( s.notes||'')+'</textarea>'
        +'<button onclick="savePerfStageNote('+pl.id+',\''+s.key+'\')" style="margin-top:4px;background:transparent;border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:4px 8px;font-size:var(--fsxs);cursor:pointer;font-family:Georgia,serif">Save</button></div>'
        +'<button onclick="togglePerfStage('+pl.id+',\''+s.key+'\')" style="width:28px;height:28px;border:2px solid '+(s.done?'var(--green)':s.color)+';border-radius:50%;background:'+(s.done?'var(--green)':'transparent')+';color:'+(s.done?'#0a0a0e':'var(--dim)')+';font-size:var(--fsmd);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">'+(s.done?'\u2713':'')+'</button>'
        +'</div></div>';
    });
    h+='<div style="font-size:var(--fsxs);color:var(--dim);letter-spacing:.15em;text-transform:uppercase;margin:12px 0 8px">Mock Run-through Log</div>'
      +'<div style="background:#0a0a12;border:1px solid #1c1c28;border-radius:8px;padding:11px;margin-bottom:8px">'
      +'<select id="pr-r-'+pl.id+'" style="margin-bottom:8px;font-size:16px"><option value="">-- rate this run --</option>';
    PRESSURE.forEach(function(p2,i){h+='<option value="'+(i+1)+'">'+p2+'</option>';});
    h+='</select><textarea id="pr-n-'+pl.id+'" style="background:#0b0b12;border:1px solid var(--border);border-radius:5px;padding:7px;color:var(--text);font-size:14px;font-family:Georgia,serif;width:100%;height:48px;resize:none;outline:none;margin-bottom:7px" placeholder="What held up? What fell apart?"></textarea>'
      +'<button onclick="logPressureRun('+pl.id+')" style="background:var(--gold);color:#0a0a0e;border:none;border-radius:6px;padding:8px 14px;font-size:var(--fsxs);cursor:pointer;font-family:Georgia,serif;font-weight:bold">Log Run-through</button></div>';
    if(pl.pressureLog.length){
      pl.pressureLog.slice(0,5).forEach(function(r){
        h+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)">'
          +'<div><div style="font-size:var(--fsmd)">'+PRESSURE[r.rating-1]+'</div>'+(r.notes?'<div style="font-size:var(--fsxs);color:var(--dim);font-style:italic">"'+r.notes+'"</div>':'')+'</div>'
          +'<span style="font-size:var(--fsxs);color:var(--dim)">'+r.date+'</span></div>';
      });
    }
    h+='<div style="font-size:var(--fsxs);color:var(--dim);letter-spacing:.15em;text-transform:uppercase;margin:12px 0 8px">Post-Gebrian Maintenance</div>';
    pl.extMaint.forEach(function(m,i){
      var isN=!m.done&&m.date>=t&&m.date<=addWks(t,1);
      var bc=m.done?'var(--green)':isN?'var(--gold)':'var(--border)';
      h+='<button onclick="toggleExtMaint('+pl.id+','+i+')" style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:'+(m.done?'#0e1a0e':isN?'#1a1500':'#0a0a12')+';border:1px solid '+bc+';border-radius:7px;padding:9px 11px;margin-bottom:5px;cursor:pointer;font-family:Georgia,serif">'
        +'<span style="width:18px;height:18px;border:2px solid '+bc+';border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fsxs);flex-shrink:0;background:'+(m.done?'var(--green)':'transparent')+';color:'+(m.done?'#0a0a0e':'transparent')+'">'+(m.done?'\u2713':'')+'</span>'
        +'<div style="flex:1"><div style="font-size:var(--fsmd);color:'+(m.done?'var(--dim)':isN?'var(--gold)':'var(--text)')+';text-decoration:'+(m.done?'line-through':'none')+'">'+m.label+'</div>'
        +'<div style="font-size:var(--fsxs);color:'+(isN?'var(--gold)':'var(--dim)')+'">'+m.date+(isN?' \u2014 due soon!':'')+'</div></div></button>';
    });
    h+='<div style="display:flex;gap:8px;margin-top:10px">'
      +'<button onclick="archivePerfPlan('+pl.id+')" class="btn-sm">Archive</button>'
      +'<button onclick="delPerfPlan('+pl.id+')" style="background:transparent;border:1px solid var(--red);color:var(--red);border-radius:6px;padding:5px 10px;font-size:var(--fsxs);cursor:pointer;font-family:Georgia,serif">Remove</button>'
      +'</div></div></div>';
  });
  if(arch.length){
    h+='<div style="font-size:var(--fsxs);color:var(--dim);letter-spacing:.18em;text-transform:uppercase;margin:16px 0 8px">Archived</div>';
    arch.forEach(function(pl){
      h+='<div class="card" style="opacity:.5;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
        +'<div><div style="font-size:var(--fsmd)">'+pl.pieceName+'</div><div style="font-size:var(--fsxs);color:var(--dim)">'+pl.perfDate+'</div></div>'
        +'<div style="display:flex;gap:6px"><button onclick="archivePerfPlan('+pl.id+')" class="btn-sm">Restore</button>'
        +'<button onclick="delPerfPlan('+pl.id+')" class="btn-sm">&#x2715;</button></div></div>';
    });
  }
  return h;
}

var insSecInst=null, insSecPeriod='total';
function insSecPer(per){
  insSecPeriod=per;
  ['week','month','total'].forEach(function(p){
    var b=document.getElementById('ins-'+p); if(!b) return;
    var act=p===per;
    b.style.background=act?'var(--gold)':'transparent';
    b.style.color=act?'#0a0a0e':'var(--dim)';
    b.style.borderColor=act?'var(--gold)':'var(--border)';
  });
  insSecDraw();
}
function insSecDraw(){
  var canvas=document.getElementById('ins-sec-canvas'); if(!canvas) return;
  if(insSecInst){insSecInst.destroy();insSecInst=null;}
  var pieceEl=document.getElementById('ins-sec-piece');
  var filterPid=pieceEl&&pieceEl.value?+pieceEl.value:null;
  var t=today();
  var filtSessions=sessions;
  if(insSecPeriod==='week') filtSessions=sessions.filter(function(s){return s.date>=addWks(t,-1);});
  else if(insSecPeriod==='month') filtSessions=sessions.filter(function(s){return s.date.slice(0,7)===t.slice(0,7);});
  var cols=['#c9a96e','#5b9bd5','#56b870','#a07cd0','#d96060','#e8a838','#5bc8c8','#e87438'];
  var secMap={};
  var colIdx=0;
  var plist=filterPid?pieces.filter(function(p){return p.id===filterPid;}):pieces;
  plist.forEach(function(p){
    sortedSecs(p.sections).forEach(function(sec){
      var key=p.id+':'+sec.id;
      var label=(filterPid?'':p.name+' › ')+sec.name;
      secMap[key]={label:label,mins:0,col:cols[colIdx%cols.length]};
      colIdx++;
      sortedSS(sec.subsections).forEach(function(ss){
        var skey=key+':'+ss.id;
        secMap[skey]={label:(filterPid?'':p.name+' › ')+sec.name+' › '+ss.name,mins:0,col:cols[colIdx%cols.length]};
        colIdx++;
      });
    });
  });
  filtSessions.forEach(function(s){
    if(!s.entries) return;
    s.entries.forEach(function(e){
      if(filterPid&&e.pieceId!==filterPid) return;
      var mins=e.duration||0;
      if(e.sectionId){
        var key=e.pieceId+':'+e.sectionId;
        var skey=e.ssId?key+':'+e.ssId:null;
        if(skey&&secMap[skey]) secMap[skey].mins+=mins;
        else if(secMap[key]) secMap[key].mins+=mins;
      }
    });
  });
  var entries=Object.values(secMap).filter(function(x){return x.mins>0;});
  if(!entries.length){canvas.style.display='none';return;}
  canvas.style.display='block';
  insSecInst=new Chart(canvas,{
    type:'bar',
    data:{
      labels:entries.map(function(e){return e.label;}),
      datasets:[{
        data:entries.map(function(e){return e.mins;}),
        backgroundColor:entries.map(function(e){return e.col+'cc';}),
        borderColor:entries.map(function(e){return e.col;}),
        borderWidth:1,borderRadius:4
      }]
    },
    options:{
      indexAxis:'y',responsive:true,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ' '+fmtDur(ctx.raw);}}}},
      scales:{
        x:{ticks:{color:'#7a7898',callback:function(v){return fmtDur(v);}},grid:{color:'#22222e'},beginAtZero:true},
        y:{ticks:{color:'#7a7898',font:{size:10}},grid:{color:'#22222e'}}
      }
    }
  });
}


document.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') e.preventDefault();
});

render();
</script>
